services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://yapmitai:yapmitai@postgres:5432/yapmitai
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /app/storage/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - chroma_data:/app/storage/chroma

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yapmitai
      POSTGRES_PASSWORD: yapmitai
      POSTGRES_DB: yapmitai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yapmitai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  chroma_data:
